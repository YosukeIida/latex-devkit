x-texlive-image:
  image_repo: &texlive_image_repo ${TEXLIVE_IMAGE_REPO:-texlive/texlive}
  image_tag: &texlive_image_tag ${TEXLIVE_IMAGE_TAG:-TL2024-historic}
  image: &texlive_image ${TEXLIVE_IMAGE_REPO:-texlive/texlive}:${TEXLIVE_IMAGE_TAG:-TL2024-historic}

services:
  texd:
    image: *texlive_image
    working_dir: /workspace
    volumes:
      - ${WORKSPACE_ROOT}:/workspace
      - ${LATEX_PROJECTS_DIR:-${WORKSPACE_ROOT}/projects}:/workspace/projects
      # ビルド既定値。compose ファイル相対で解決されるため、WORKSPACE_ROOT を
      # 上書きしても常に latex-devkit 同梱のものが入る。
      - ./latexmk/defaults.latexmkrc:/etc/latex-devkit/defaults.latexmkrc:ro
    command: ["sleep", "infinity"]
    tty: true
    stdin_open: true
    init: true
